[project]
name = "langchain-study"
version = "0.1.0"
description = "LangChain / LangGraph 공부 + MLflow 트레이싱"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph>=1.0",
    "mlflow>=3.14,<3.15",
    "python-dotenv>=1.0",
    "ipykernel>=6.29",
    "langchain-openai>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-community>=0.4.2",
    "pypdf>=6.19.0",
]

# common/ 을 패키지로 설치 → 어느 폴더의 노트북에서든 `from common import ...` 가능
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
